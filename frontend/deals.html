<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise CRM - Deals</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="crm-layout">

    <aside class="sidebar">

        <h2>Enterprise CRM</h2>
        <p class="sidebar-user">CRM Management</p>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="customers.html">Customers</a>
            <a href="leads.html">Leads</a>
            <a href="deals.html" class="active">Deals</a>
            <a href="activities.html">Activity Logs</a>
        </nav>

        <button class="logout-btn" onclick="logout()">Logout</button>

    </aside>


    <main class="main-content">

        <div class="dashboard-header">
            <h1>Deals</h1>
            <p>Manage sales opportunities and deal stages</p>
        </div>


        <!-- ADD DEAL FORM - ADMIN ONLY -->

        <div class="card" id="addDealCard">

            <h2>Add Deal</h2>

            <form id="dealForm">

                <label>Deal Title</label>

                <input
                    type="text"
                    id="dealTitle"
                    placeholder="Enter deal title"
                    required
                >


                <label>Customer Name</label>

                <input
                    type="text"
                    id="dealCustomer"
                    placeholder="Enter customer name"
                    required
                >


                <label>Deal Value</label>

                <input
                    type="number"
                    id="dealValue"
                    placeholder="Enter deal value"
                    min="0"
                    required
                >


                <label>Deal Stage</label>

                <select id="dealStage">

                    <option value="Prospecting">Prospecting</option>
                    <option value="Negotiation">Negotiation</option>
                    <option value="Closed Won">Closed Won</option>
                    <option value="Closed Lost">Closed Lost</option>

                </select>


                <label>Expected Closing Date</label>

                <input
                    type="date"
                    id="expectedDate"
                    required
                >


                <button type="submit">
                    Add Deal
                </button>

            </form>

        </div>


        <!-- DEAL LIST -->

        <div class="card">

            <h2>Deal List</h2>

            <div id="dealList">
                Loading deals...
            </div>

        </div>

    </main>

</div>


<script>

const userId = localStorage.getItem("userId");
const userRole = localStorage.getItem("userRole");


/* ================= LOGIN CHECK ================= */

if (!userId) {

    window.location.href = "index.html";

}


/* ================= HIDE ADMIN FEATURES FOR USER ================= */

if (userRole !== "Admin") {

    document.getElementById("addDealCard").style.display = "none";

}


/* ================= ADD DEAL ================= */

document.getElementById("dealForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const title =
            document.getElementById("dealTitle").value;

        const customer =
            document.getElementById("dealCustomer").value;

        const value =
            Number(document.getElementById("dealValue").value);

        const stage =
            document.getElementById("dealStage").value;

        const expectedDate =
            document.getElementById("expectedDate").value;


        try {

            const response = await fetch(
                "http://localhost:5000/api/deals",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "user-id": userId
                    },

                    body: JSON.stringify({
                        title: title,
                        customer: customer,
                        value: value,
                        stage: stage,
                        expectedDate: expectedDate
                    })
                }
            );


            const data = await response.json();


            if (response.ok) {

                alert("Deal added successfully!");

                document.getElementById("dealForm").reset();

                loadDeals();

            } else {

                alert(
                    data.message ||
                    "Failed to add deal"
                );

            }

        } catch (error) {

            console.log("Add Deal Error:", error);

            alert(
                "Server error. Please check the backend."
            );

        }

    }
);


/* ================= LOAD DEALS ================= */

async function loadDeals() {

    try {

        const response = await fetch(
            "http://localhost:5000/api/deals"
        );


        const deals = await response.json();

        const dealList =
            document.getElementById("dealList");


        if (deals.length === 0) {

            dealList.innerHTML =
                "<p>No deals found.</p>";

            return;

        }


        dealList.innerHTML = "";


        deals.forEach(function(deal) {

            const dealDiv =
                document.createElement("div");

            dealDiv.className = "deal";


            let buttons = "";


            /* ADMIN ONLY BUTTONS */

            if (userRole === "Admin") {

                buttons = `

                    <button
                        onclick="editDeal(
                            '${deal._id}',
                            '${deal.title}',
                            '${deal.customer}',
                            '${deal.value || 0}',
                            '${deal.stage}',
                            '${deal.expectedDate || ""}'
                        )">
                        Edit
                    </button>


                    <button
                        onclick="deleteDeal('${deal._id}')">
                        Delete
                    </button>

                `;

            }


            dealDiv.innerHTML = `

                <h3>${deal.title}</h3>

                <p>
                    <strong>Customer:</strong>
                    ${deal.customer}
                </p>

                <p>
                    <strong>Deal Value:</strong>
                    ₹${deal.value || 0}
                </p>

                <p>
                    <strong>Stage:</strong>
                    ${deal.stage}
                </p>

                <p>
                    <strong>Expected Date:</strong>
                    ${deal.expectedDate || "Not specified"}
                </p>

                ${buttons}

            `;


            dealList.appendChild(dealDiv);

        });


    } catch (error) {

        console.log("Load Deals Error:", error);

        document.getElementById("dealList").innerHTML =
            "<p>Unable to load deals. Please check the backend.</p>";

    }

}


/* ================= EDIT DEAL ================= */

async function editDeal(
    id,
    oldTitle,
    oldCustomer,
    oldValue,
    oldStage,
    oldDate
) {


    if (userRole !== "Admin") {

        alert("Access denied. Admin only.");

        return;

    }


    const title = prompt(
        "Enter deal title:",
        oldTitle
    );

    if (title === null) {
        return;
    }


    const customer = prompt(
        "Enter customer name:",
        oldCustomer
    );

    if (customer === null) {
        return;
    }


    const value = prompt(
        "Enter deal value:",
        oldValue
    );

    if (value === null) {
        return;
    }


    const stage = prompt(
        "Enter stage (Prospecting, Negotiation, Closed Won, Closed Lost):",
        oldStage
    );

    if (stage === null) {
        return;
    }


    const validStages = [
        "Prospecting",
        "Negotiation",
        "Closed Won",
        "Closed Lost"
    ];


    if (!validStages.includes(stage)) {

        alert(
            "Invalid stage. Please use a valid deal stage."
        );

        return;

    }


    const expectedDate = prompt(
        "Enter expected closing date (YYYY-MM-DD):",
        oldDate
    );

    if (expectedDate === null) {
        return;
    }


    try {

        const response = await fetch(
            "http://localhost:5000/api/deals/" + id,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    title: title,
                    customer: customer,
                    value: Number(value),
                    stage: stage,
                    expectedDate: expectedDate
                })
            }
        );


        const data = await response.json();


        if (response.ok) {

            alert("Deal updated successfully!");

            loadDeals();

        } else {

            alert(
                data.message ||
                "Failed to update deal"
            );

        }

    } catch (error) {

        console.log("Edit Deal Error:", error);

        alert(
            "Server error. Please check the backend."
        );

    }

}


/* ================= DELETE DEAL ================= */

async function deleteDeal(id) {


    if (userRole !== "Admin") {

        alert("Access denied. Admin only.");

        return;

    }


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this deal?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response = await fetch(
            "http://localhost:5000/api/deals/" + id,
            {
                method: "DELETE",

                headers: {
                    "user-id": userId
                }
            }
        );


        const data = await response.json();


        if (response.ok) {

            alert("Deal deleted successfully!");

            loadDeals();

        } else {

            alert(
                data.message ||
                "Failed to delete deal"
            );

        }

    } catch (error) {

        console.log("Delete Deal Error:", error);

        alert(
            "Server error. Please check the backend."
        );

    }

}


/* ================= LOGOUT ================= */

function logout() {

    localStorage.removeItem("userId");
    localStorage.removeItem("userName");
    localStorage.removeItem("userRole");

    window.location.href = "index.html";

}


loadDeals();

</script>

</body>

</html>
