<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise CRM - Activity Logs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="crm-layout">

    <aside class="sidebar">

        <h2>Enterprise CRM</h2>
        <p class="sidebar-user">CRM Management</p>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="customers.html">Customers</a>
            <a href="leads.html">Leads</a>
            <a href="deals.html">Deals</a>
            <a href="activities.html" class="active">Activity Logs</a>
        </nav>

        <button class="logout-btn" onclick="logout()">Logout</button>

    </aside>


    <main class="main-content">

        <div class="dashboard-header">
            <h1>Activity Logs</h1>
            <p>Track customer calls, emails, meetings and follow-ups</p>
        </div>


        <!-- ADD ACTIVITY -->

        <div class="card" id="addActivityCard">

            <h2>Add Activity</h2>

            <form id="activityForm">

                <label>Customer Name</label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter customer name"
                    required
                >


                <label>Activity Type</label>

                <select id="activityType">

                    <option value="Call">Call</option>
                    <option value="Email">Email</option>
                    <option value="Meeting">Meeting</option>
                    <option value="Follow-up">Follow-up</option>

                </select>


                <label>Description</label>

                <input
                    type="text"
                    id="description"
                    placeholder="Enter activity description"
                    required
                >


                <label>Date</label>

                <input
                    type="date"
                    id="activityDate"
                    required
                >


                <button type="submit">
                    Add Activity
                </button>

            </form>

        </div>


        <!-- ACTIVITY LIST -->

        <div class="card">

            <h2>Activity List</h2>

            <div id="activityList">
                Loading activities...
            </div>

        </div>

    </main>

</div>


<script>

const userId = localStorage.getItem("userId");
const userRole = localStorage.getItem("userRole");


/* ================= LOGIN CHECK ================= */

if (!userId) {

    window.location.href = "index.html";

}


/* ================= ADD ACTIVITY ================= */

document.getElementById("activityForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const customerName =
            document.getElementById("customerName").value;

        const activityType =
            document.getElementById("activityType").value;

        const description =
            document.getElementById("description").value;

        const date =
            document.getElementById("activityDate").value;


        try {

            const response = await fetch(
                "http://localhost:5000/api/activities",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        customerName: customerName,
                        activityType: activityType,
                        description: description,
                        date: date
                    })
                }
            );


            const data = await response.json();


            if (response.ok) {

                alert("Activity added successfully!");

                document.getElementById("activityForm").reset();

                loadActivities();

            } else {

                alert(
                    data.message ||
                    "Failed to add activity"
                );

            }

        } catch (error) {

            console.log("Add Activity Error:", error);

            alert(
                "Server error. Please check the backend."
            );

        }

    }
);


/* ================= LOAD ACTIVITIES ================= */

async function loadActivities() {

    try {

        const response = await fetch(
            "http://localhost:5000/api/activities"
        );


        const activities = await response.json();

        const activityList =
            document.getElementById("activityList");


        if (activities.length === 0) {

            activityList.innerHTML =
                "<p>No activities found.</p>";

            return;

        }


        activityList.innerHTML = "";


        activities.forEach(function(activity) {

            const activityDiv =
                document.createElement("div");

            activityDiv.className = "activity-item";


            let deleteButton = "";


            /* ADMIN ONLY DELETE BUTTON */

            if (userRole === "Admin") {

                deleteButton = `

                    <button
                        onclick="deleteActivity('${activity._id}')">
                        Delete
                    </button>

                `;

            }


            activityDiv.innerHTML = `

                <h3>${activity.activityType}</h3>

                <p>
                    <strong>Customer:</strong>
                    ${activity.customerName}
                </p>

                <p>
                    <strong>Description:</strong>
                    ${activity.description}
                </p>

                <p>
                    <strong>Date:</strong>
                    ${activity.date}
                </p>

                ${deleteButton}

            `;


            activityList.appendChild(activityDiv);

        });


    } catch (error) {

        console.log("Load Activities Error:", error);

        document.getElementById("activityList").innerHTML =
            "<p>Unable to load activities. Please check the backend.</p>";

    }

}


/* ================= DELETE ACTIVITY ================= */

async function deleteActivity(id) {


    /*
        Only Admin can delete.
    */

    if (userRole !== "Admin") {

        alert("Access denied. Admin only.");

        return;

    }


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this activity?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response = await fetch(
            "http://localhost:5000/api/activities/" + id,
            {
                method: "DELETE"
            }
        );


        const data = await response.json();


        if (response.ok) {

            alert("Activity deleted successfully!");

            loadActivities();

        } else {

            alert(
                data.message ||
                "Failed to delete activity"
            );

        }

    } catch (error) {

        console.log("Delete Activity Error:", error);

        alert(
            "Server error. Please check the backend."
        );

    }

}


/* ================= LOGOUT ================= */

function logout() {

    localStorage.removeItem("userId");
    localStorage.removeItem("userName");
    localStorage.removeItem("userRole");

    window.location.href = "index.html";

}


loadActivities();

</script>

</body>

</html>
